<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personnel Desk V3.0 | Sistem Izin Karyawan</title>
<style>
:root{--bg:#f3f6fa;--paper:#fff;--ink:#17293d;--muted:#64758b;--line:#dce4ed;--accent:#146b61;--accent2:#0e554e;--soft:#e7f4f0;--navy:#132e42;--red:#a94442;--green:#16804b;--amber:#a66b12;--shadow:0 5px 18px #19364a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover{background:#f1f5f8}button:disabled{opacity:.55;cursor:not-allowed}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.primary:hover{background:var(--accent2)}button.danger{color:var(--red)}button.subtle{background:var(--soft);border-color:transparent;color:var(--accent2)}button.small{font-size:12px;padding:6px 9px}input,select,textarea{width:100%;min-width:0;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:var(--ink);padding:10px 11px}input[readonly]{background:#eef2f6;color:#526579}textarea{min-height:95px;resize:vertical}label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.muted{color:var(--muted)}.smalltext{font-size:12px}.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px max(18px,calc((100vw - 1500px)/2))}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:#2b897b;display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:18px;line-height:1.2;margin:0}.brand p{font-size:11px;color:#b8cbd7;margin:3px 0 0}.topright{display:flex;align-items:center;gap:8px}.topright button{background:#ffffff14;color:#fff;border-color:#ffffff33}.topuser{font-size:12px;color:#d0e1e7}.shell{max-width:1500px;margin:auto;padding:22px 18px 40px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px}.sidebar{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;height:max-content;position:sticky;top:14px;box-shadow:var(--shadow)}.navgroup{margin-bottom:15px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8997a8;font-weight:800;padding:8px 10px}.navbtn{width:100%;justify-content:flex-start;background:transparent;border-color:transparent;color:#526579;margin:2px 0;text-align:left}.navbtn.active{background:var(--soft);color:var(--accent2);border-color:#d2e9e2}.navbtn .count{margin-left:auto;background:#e8eef4;border-radius:20px;padding:1px 7px;font-size:11px}.content{min-width:0}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:17px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:1.3px;color:var(--accent);text-transform:uppercase}.pagehead h2{font-size:25px;letter-spacing:-.6px;margin:3px 0 0}.pagehead p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin-bottom:15px}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);min-width:0}.stat{padding:14px 16px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;line-height:1.2;margin-top:4px;letter-spacing:-.6px}.stat small{color:var(--muted);font-size:11px}.panel{overflow:hidden}.panelhead{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}.panelhead h3{font-size:15px;margin:0}.panelbody{padding:16px 17px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{background:#f5f8fb;color:#65758a;font-size:10px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}th,td{padding:11px 12px;border-bottom:1px solid #e7edf3;vertical-align:middle}tbody tr:last-child td{border-bottom:0}.name{font-weight:750;display:block}.sub{display:block;color:var(--muted);font-size:11px}.badge{display:inline-block;border-radius:6px;padding:4px 8px;font-size:11px;font-weight:750;white-space:nowrap;background:#edf1f6;color:#526579}.badge.menunggu_hrd{background:#fff3df;color:#99600c}.badge.menunggu_manager{background:#eaf1ff;color:#315da8}.badge.disetujui{background:#e2f5e9;color:#176a3c}.badge.ditolak{background:#fae8e7;color:#a33e3a}.badge.admin{background:#f0eaff;color:#7142b7}.badge.hrd{background:#e5f7ef;color:#17744b}.badge.manager{background:#fff1df;color:#95600e}.badge.employee{background:#eaf1ff;color:#315da8}.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:15px;margin:5px 0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.field{min-width:0}.hero{background:linear-gradient(120deg,#123448,#146b61);color:#fff;border-radius:15px;padding:22px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;gap:16px}.hero h2{margin:0;font-size:23px}.hero p{color:#d5e6e4;margin:5px 0 0}.hero button{background:white;color:var(--accent2);border-color:white}.callout{padding:12px 14px;border:1px solid #d9e7e4;background:#f2f9f7;border-radius:10px;color:#3f625e;font-size:12px;margin-bottom:13px}.warn{padding:12px 14px;border:1px solid #f0dfbd;background:#fff8e9;border-radius:10px;color:#805b19;font-size:12px;margin-bottom:13px}.form{display:grid;gap:14px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.formtitle{font-size:11px;font-weight:850;letter-spacing:.9px;text-transform:uppercase;color:var(--accent);margin:5px 0 -3px}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.statusline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.timeline{display:grid;gap:10px}.event{display:grid;grid-template-columns:16px minmax(0,1fr);gap:9px}.eventdot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin:5px 0 0 2px;box-shadow:0 0 0 4px var(--soft)}.event p{margin:0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input{max-width:300px}.modalback{position:fixed;inset:0;background:#102638a8;z-index:50;display:none;align-items:center;justify-content:center;padding:15px}.modalback.open{display:flex}.modal{background:white;border-radius:14px;width:min(650px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 80px #10263850}.modal.wide{width:min(850px,100%)}.modalhead,.modalfoot{padding:14px 17px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0;font-size:17px}.modalbody{padding:17px}.modalfoot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end}.notice{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start}.notice.unread{background:#f1f8f6;border-color:#cce5dc}.notice p{margin:3px 0;color:var(--muted);font-size:12px}.qrbox{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.qrbox img{width:220px;height:220px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}.qrurl{word-break:break-all;background:#f4f7fa;padding:10px;border-radius:8px;font-size:12px}.login{min-height:100vh;background:linear-gradient(130deg,#112c40,#146b61);display:grid;place-items:center;padding:18px}.loginbox{background:#fff;width:min(420px,100%);border-radius:18px;padding:27px;box-shadow:0 20px 70px #0003}.loginbox h1{margin:0;font-size:23px}.loginbox p{color:var(--muted);font-size:13px}.loginbox form{display:grid;gap:12px}.loginerr{color:var(--red);font-size:12px;min-height:18px}.toast{position:fixed;bottom:18px;right:18px;max-width:min(420px,calc(100% - 36px));background:#173f38;color:white;padding:12px 16px;border-radius:10px;box-shadow:0 5px 25px #102e3840;z-index:100;display:none}.toast.show{display:block}.toast.bad{background:#863c3b}.mutednote{font-size:11px;color:var(--muted)}.right{text-align:right}.nowrap{white-space:nowrap}.hidden{display:none!important}.printdoc{display:none}.printdoc .company{text-align:center;margin-bottom:12px}.printdoc .company img{width:165px;height:auto;max-height:55px;object-fit:contain}
@media(max-width:1050px){.shell{grid-template-columns:190px minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.shell{display:block;padding:13px}.sidebar{position:static;display:flex;overflow:auto;gap:5px;margin-bottom:13px;padding:8px}.navgroup{display:flex;margin:0;gap:4px}.navlabel{display:none}.navbtn{width:auto;white-space:nowrap;margin:0;padding:8px 10px}.top{padding:12px}.topuser{display:none}.pagehead{align-items:flex-start;flex-direction:column}.hero{align-items:flex-start;flex-direction:column}.grid2,.grid3{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.qrbox{justify-content:center}.qrbox img{width:190px;height:190px}}@media(max-width:440px){.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:23px}.brand h1{font-size:15px}.brand p{font-size:10px}.topright{gap:4px}.topright button{padding:7px}.pagehead h2{font-size:22px}}
@media print{@page{size:A4;margin:18mm}body{background:#fff!important}.top,.sidebar,.content,.modalback,.toast{display:none!important}.printdoc{display:block!important;font:12pt/1.5 Arial,sans-serif;color:#000}.printdoc h1{text-align:center;text-decoration:underline;font-size:17pt;margin:0 0 28px}.printdoc .company{text-align:center;font-weight:bold;font-size:14pt}.printdoc .data{width:100%;border-collapse:collapse;margin-top:22px}.printdoc .data td{border:0;padding:5px 4px;vertical-align:top}.printdoc .data td:first-child{width:36%}.printdoc .sign{width:100%;border-collapse:collapse;margin-top:55px;table-layout:fixed}.printdoc .sign td{border:1px solid #000;text-align:center;padding:8px 5px;height:115px;vertical-align:top}.printdoc .sign .signname{padding-top:65px;font-weight:bold}.printdoc .footer{margin-top:28px;font-size:10pt}}
</style>
</head>
<body>
<div id="root"></div><div id="modalRoot"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><div id="printRoot" class="printdoc"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const fmtDate=v=>v?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeZone:'Asia/Jakarta'}).format(new Date(String(v).slice(0,10)+'T12:00:00+07:00')):'—';
const fmtDateTime=v=>v?new Intl.DateTimeFormat('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'}).format(new Date(v)):'—';
const fmtTime=v=>v?new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jakarta'}).format(new Date(v)):'—';
const currentTime=()=>new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hourCycle:'h23',timeZone:'Asia/Jakarta'}).format(new Date())+' WIB';
const roleLabel={admin:'Admin',hrd:'HRD',manager:'Manajer',employee:'Karyawan'};
const statusLabel={menunggu_hrd:'Menunggu HRD',menunggu_manager:'Menunggu Manajer',disetujui:'Disetujui',ditolak:'Ditolak'};
let me=null,requests=[],reportRows=[],notifications=[],unread=0,users=[],employees=[],legacyLeaves=[],settings={public_form_enabled:true,public_url:''},page='dashboard',modalRequest=null,editingUser=null,editingEmployee=null,resubmitId=null,reportFilters={from:'',to:'',status:''},toastTimer;
const api=async(action,method='GET',body=null,query={})=>{const u=new URL('/api/portal',location.origin);u.searchParams.set('action',action);Object.entries(query).forEach(([k,v])=>{if(v)u.searchParams.set(k,v)});const r=await fetch(u,{method,credentials:'same-origin',cache:'no-store',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let d;try{d=await r.json()}catch{throw Error('Server tidak memberikan respons JSON.')}if(!r.ok)throw Error(d.error||'Permintaan gagal.');return d;};
const toast=(s,bad=false)=>{const t=$('toast');t.textContent=s;t.className='toast show'+(bad?' bad':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',5000)};
const statusBadge=s=>`<span class="badge ${esc(s)}">${esc(statusLabel[s]||s)}</span>`;
const roleBadge=s=>`<span class="badge ${esc(s)}">${esc(roleLabel[s]||s)}</span>`;
const initials=s=>clean(s).split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase();
const clean=s=>String(s??'').trim();
const navItems={admin:[['dashboard','Ringkasan','▦'],['requests','Surat Izin','▤'],['legacy','Arsip Izin Lama','◷'],['reports','Laporan & Export','▥'],['users','Data Pengguna','♙'],['employees','Data Karyawan','♧'],['settings','Pengaturan & QR','⌘'],['profile','Profil Saya','◎'],['notifications','Notifikasi','♢']],hrd:[['dashboard','Ringkasan','▦'],['requests','Verifikasi HRD','✓'],['history','Riwayat Verifikasi','▤'],['profile','Profil Saya','◎'],['notifications','Notifikasi','♢']],manager:[['dashboard','Ringkasan','▦'],['requests','Verifikasi Manajer','✓'],['history','Riwayat Verifikasi','▤'],['profile','Profil Saya','◎'],['notifications','Notifikasi','♢']],employee:[['dashboard','Beranda Saya','▦'],['new','Ajukan Izin Keluar','＋'],['history','Riwayat Pengajuan','▤'],['profile','Profil Saya','◎'],['notifications','Notifikasi','♢']]};
async function refresh(){const [m,r,n]=await Promise.all([api('me'),api('requests'),api('notifications')]);me=m.user;requests=r.requests||[];reportRows=requests;notifications=n.notifications||[];unread=n.unread||0;if(me.role==='admin'){const [u,e,s,l]=await Promise.all([api('users'),api('employees'),api('settings'),api('legacy-leaves')]);users=u.users||[];employees=e.employees||[];settings=s;legacyLeaves=l.leaves||[];}render();}
function showLogin(error=''){ $('root').innerHTML=`<main class="login"><section class="loginbox"><div class="logo" style="margin-bottom:15px">PD</div><h1>Personnel Desk <span class="muted" style="font-size:12px">V3.0</span></h1><p>Sistem Manajemen & Persetujuan Izin Karyawan</p><form id="loginForm"><div><label>Username</label><input name="username" autocomplete="username" required placeholder="Masukkan username"></div><div><label>Password</label><input name="password" type="password" autocomplete="current-password" required placeholder="Masukkan password"></div><div class="loginerr">${esc(error)}</div><button class="primary" type="submit">Masuk ke Sistem</button></form><p class="mutednote">Akun awal: <b>admin</b> dengan password APP_PASSWORD lama (atau ADMIN_PASSWORD jika sudah diatur). Setelah masuk, buat akun HRD, Manajer, dan Karyawan.</p></section></main>`;$('loginForm').onsubmit=login;}
async function login(e){e.preventDefault();const f=new FormData(e.currentTarget);const b=e.currentTarget.querySelector('button');b.disabled=true;try{await api('login','POST',{username:f.get('username'),password:f.get('password')});await refresh();if(new URLSearchParams(location.search).has('scan')&&me.role==='employee'){page='new';history.replaceState({},'',location.pathname);}render();toast('Berhasil masuk.');}catch(err){showLogin(err.message)}finally{b.disabled=false}}
function logout(){api('logout','POST',{}).finally(()=>{me=null;requests=[];notifications=[];users=[];employees=[];showLogin()})}
function render(){if(!me){showLogin();return;}const items=navItems[me.role]||[];const nav=items.map(([id,label,icon])=>`<button class="navbtn ${page===id?'active':''}" data-nav="${id}"><span>${icon}</span>${label}${id==='notifications'&&unread?`<span class="count">${unread}</span>`:''}</button>`).join('');$('root').innerHTML=`<header class="top"><div class="brand"><div class="logo">PD</div><div><h1>Personnel Desk <span style="font-size:10px;opacity:.7">V3.0</span></h1><p>Sistem Manajemen & Persetujuan Izin</p></div></div><div class="topright"><span class="topuser">${esc(me.full_name)} · ${roleLabel[me.role]}</span><button data-nav="notifications" title="Notifikasi">♢ ${unread?`(${unread})`:''}</button><button data-act="logout">Keluar</button></div></header><div class="shell"><aside class="sidebar"><div class="navgroup"><div class="navlabel">Menu ${roleLabel[me.role]}</div>${nav}</div></aside><main class="content" id="content">${renderPage()}</main></div>`;bind();}
function pageHead(title,desc,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${roleLabel[me.role]} / Personnel Desk</div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`;}
function stat(label,value,sub=''){return `<div class="stat"><span>${label}</span><strong>${value}</strong>${sub?`<small>${sub}</small>`:''}</div>`;}
function requestTable(rows,review=false){if(!rows.length)return `<div class="empty"><strong>Belum ada pengajuan</strong><span>Tidak ada data yang perlu ditampilkan.</span></div>`;return `<div class="tablewrap"><table><thead><tr><th>Karyawan</th><th>Tanggal / Jam Keluar</th><th>Jam Kembali</th><th>Keperluan</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="name">${esc(r.employee_name)}</span><span class="sub">${esc(r.position||'—')} · ${esc(r.division||'—')}</span></td><td>${fmtDate(r.request_date)}<span class="sub">Keluar ${fmtTime(r.exit_at)}</span></td><td>${String(r.return_time||'').slice(0,5)}</td><td>${esc(r.reason)}</td><td>${statusBadge(r.status)}</td><td class="nowrap"><button class="small" data-act="detail" data-id="${r.id}">Detail</button>${review&&((me.role==='hrd'&&r.status==='menunggu_hrd')||(me.role==='manager'&&r.status==='menunggu_manager'))?` <button class="small primary" data-act="review" data-id="${r.id}">Verifikasi</button>`:''}${me.role==='employee'&&r.status==='ditolak'?` <button class="small primary" data-act="resubmit" data-id="${r.id}">Perbaiki</button>`:''}${r.status==='disetujui'?` <button class="small" data-act="pdf" data-id="${r.id}">PDF</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
function renderDashboard(){if(me.role==='employee'){const counts=['menunggu_hrd','menunggu_manager','disetujui','ditolak'].map(s=>requests.filter(r=>r.status===s).length);return `${pageHead('Beranda Saya','Pantau pengajuan izin keluar dan status persetujuan.')}<section class="hero"><div><h2>Halo, ${esc(me.employee?.name||me.full_name)}!</h2><p>Ajukan izin keluar kantor dan pantau proses persetujuannya.</p></div><button class="primary" data-nav="new">＋ Buat Pengajuan</button></section><section class="stats">${stat('Menunggu HRD',counts[0])}${stat('Menunggu Manajer',counts[1])}${stat('Disetujui',counts[2])}${stat('Ditolak',counts[3])}</section><section class="panel"><div class="panelhead"><h3>Pengajuan Terbaru</h3><button class="small" data-nav="history">Lihat semua</button></div>${requestTable(requests.slice(0,5))}</section>`;}
if(me.role==='hrd'||me.role==='manager'){const status=me.role==='hrd'?'menunggu_hrd':'menunggu_manager',queue=requests.filter(r=>r.status===status),processed=requests.filter(r=>(me.role==='hrd'?r.hrd_user_id:r.manager_user_id)===me.id);return `${pageHead(me.role==='hrd'?'Verifikasi HRD':'Verifikasi Manajer','Periksa pengajuan yang menunggu tindakan Anda.')}<section class="stats">${stat('Menunggu tindakan',queue.length)}${stat('Sudah diproses',processed.length)}${stat('Total terlihat',requests.length)}${stat('Notifikasi belum dibaca',unread)}</section><section class="panel"><div class="panelhead"><h3>Antrean verifikasi</h3><span class="badge ${status}">${queue.length} pengajuan</span></div>${requestTable(queue,true)}</section>`;}
const pending=requests.filter(r=>r.status==='menunggu_hrd'||r.status==='menunggu_manager').length,approved=requests.filter(r=>r.status==='disetujui').length,rejected=requests.filter(r=>r.status==='ditolak').length,hrdCount=users.filter(u=>u.role==='hrd'&&u.is_active).length,managerCount=users.filter(u=>u.role==='manager'&&u.is_active).length;return `${pageHead('Ringkasan Administrasi','Pantau seluruh pengajuan, akun, dan alur persetujuan.')}<section class="stats">${stat('Total Pengajuan',requests.length)}${stat('Menunggu Persetujuan',pending)}${stat('Disetujui',approved)}${stat('Ditolak',rejected)}</section>${!hrdCount||!managerCount?`<div class="warn">Perhatian: ${!hrdCount?'Belum ada akun HRD aktif. ':''}${!managerCount?'Belum ada akun Manajer aktif.':''}Buat akun melalui menu Data Pengguna agar alur persetujuan dapat berjalan.</div>`:''}<section class="grid2"><div class="panel"><div class="panelhead"><h3>Pengajuan terbaru</h3><button class="small" data-nav="requests">Lihat semua</button></div>${requestTable(requests.slice(0,6))}</div><div class="panel"><div class="panelhead"><h3>Kesiapan sistem</h3></div><div class="panelbody"><div class="timeline"><div class="event"><span class="eventdot"></span><div><b>Akun HRD aktif</b><p class="muted smalltext">${hrdCount} pengguna</p></div></div><div class="event"><span class="eventdot"></span><div><b>Akun Manajer aktif</b><p class="muted smalltext">${managerCount} pengguna</p></div></div><div class="event"><span class="eventdot"></span><div><b>Master karyawan</b><p class="muted smalltext">${employees.length} data karyawan</p></div></div></div><div class="btnrow" style="margin-top:15px"><button data-nav="users">Kelola pengguna</button><button data-nav="settings">Pengaturan QR</button></div></div></div></section>`;}

function renderSettings(){return `${pageHead('Pengaturan & QR','Atur penerimaan pengajuan dan bagikan QR Code kepada karyawan.')}<section class="panel"><div class="panelhead"><h3>Formulir QR Karyawan</h3><span class="badge ${settings.public_form_enabled?'disetujui':'ditolak'}">${settings.public_form_enabled?'Aktif':'Ditutup'}</span></div><div class="panelbody"><div class="qrbox"><img src="/api/portal?action=qr" alt="QR formulir karyawan" onerror="this.style.display='none'"><div style="flex:1;min-width:220px"><h3 style="margin:0 0 6px">Scan untuk mengajukan izin</h3><p class="muted smalltext">Karyawan scan QR, login menggunakan akun Karyawan, lalu formulir pengajuan terbuka. QR tidak memuat data pribadi.</p><div class="qrurl" id="qrUrl">${esc(settings.public_url)}</div><div class="btnrow" style="margin-top:10px"><button data-act="copy-qr">Salin Link</button><button data-act="print-qr">Cetak QR</button></div></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><form id="settingsForm" class="formgrid"><div><label>Status formulir QR</label><select name="public_form_enabled"><option value="true" ${settings.public_form_enabled?'selected':''}>Aktif — karyawan dapat mengajukan</option><option value="false" ${!settings.public_form_enabled?'selected':''}>Ditutup — pengajuan baru dinonaktifkan</option></select></div><div style="display:flex;align-items:end"><button class="primary" type="submit">Simpan Pengaturan</button></div></form></div></section><section class="panel" style="margin-top:13px"><div class="panelhead"><h3>Konfigurasi alur</h3></div><div class="panelbody"><div class="timeline"><div class="event"><span class="eventdot"></span><div><b>Tahap 1 · HRD</b><p class="muted smalltext">Seluruh akun HRD aktif menerima notifikasi dan dapat memverifikasi.</p></div></div><div class="event"><span class="eventdot"></span><div><b>Tahap 2 · Manajer</b><p class="muted smalltext">Seluruh akun Manajer aktif menerima notifikasi setelah HRD menyetujui.</p></div></div><div class="event"><span class="eventdot"></span><div><b>Keputusan akhir</b><p class="muted smalltext">Surat PDF tersedia untuk karyawan setelah Manajer menyetujui.</p></div></div></div></div></section>`;}
function renderProfile(){return `${pageHead('Profil Saya','Informasi akun dan keamanan akses.')}<section class="grid2"><div class="panel"><div class="panelhead"><h3>Informasi akun</h3></div><div class="panelbody"><div class="form"><div><span class="muted smalltext">Nama pengguna</span><div class="name">${esc(me.full_name)}</div></div><div><span class="muted smalltext">Username</span><div class="name">${esc(me.username)}</div></div><div><span class="muted smalltext">Peran</span><div>${roleBadge(me.role)}</div></div><div><span class="muted smalltext">NIK terhubung</span><div class="name">${esc(me.employee_nik||'—')}</div></div><form id="profileForm" class="form"><label>Nama tampilan</label><input name="full_name" required maxlength="180" value="${esc(me.full_name)}"><button class="primary" type="submit">Simpan Profil</button></form></div></div></div><div class="panel"><div class="panelhead"><h3>Ubah Password</h3></div><div class="panelbody"><form id="passwordForm" class="form"><div><label>Password saat ini</label><input name="current_password" type="password" required autocomplete="current-password"></div><div><label>Password baru</label><input name="new_password" type="password" required minlength="12" autocomplete="new-password"><span class="mutednote">Minimal 12 karakter.</span></div><div><label>Ulangi password baru</label><input name="confirm_password" type="password" required minlength="12" autocomplete="new-password"></div><button class="primary" type="submit">Ubah Password</button></form></div></div></section>`;}
function renderNotifications(){return `${pageHead('Notifikasi','Pemberitahuan status dan aktivitas pengajuan.','<button data-act="read-all">Tandai semua dibaca</button>')}<section class="panel"><div class="panelbody">${notifications.length?notifications.map(n=>`<div class="notice ${n.read_at?'':'unread'}"><div>${n.notification_type==='success'?'✓':n.notification_type==='warning'?'!':'●'}</div><div style="flex:1"><b>${esc(n.title)}</b><p>${esc(n.message)}</p><span class="mutednote">${fmtDateTime(n.created_at)}</span></div>${!n.read_at?`<button class="small" data-act="read-notice" data-id="${n.id}">Tandai dibaca</button>`:''}</div>`).join(''):'<div class="empty"><strong>Belum ada notifikasi</strong></div>'}</div></section>`;}
function renderPage(){switch(page){case'dashboard':return renderDashboard();case'new':return renderNewRequest();case'history':return renderHistory();case'requests':return renderRequests();case'legacy':return renderLegacy();case'reports':return renderReports();case'users':return renderUsers();case'employees':return renderEmployees();case'settings':return renderSettings();case'profile':return renderProfile();case'notifications':return renderNotifications();case'resubmit':return renderNewRequest(requests.find(r=>r.id===resubmitId));default:page='dashboard';return renderDashboard();}}
function bind(){const root=$('root');root.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(b.dataset.nav!=='resubmit')resubmitId=null;page=b.dataset.nav;render()});root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>action(b.dataset.act,b.dataset.id));const rf=$('requestForm');if(rf)rf.onsubmit=submitRequest;const sf=$('settingsForm');if(sf)sf.onsubmit=saveSettings;const pf=$('passwordForm');if(pf)pf.onsubmit=changePassword;const pr=$('profileForm');if(pr)pr.onsubmit=saveProfile;const imp=$('employeeImport');if(imp)imp.onchange=ev=>importEmployees(ev.target.files[0]);const filter=$('requestFilter');if(filter)filter.onchange=applyRequestFilter;const search=$('requestSearch');if(search)search.oninput=applyRequestFilter;const rep=$('reportFrom');if(rep){$('reportFrom').onchange=()=>reportFilters.from=rep.value;$('reportTo').onchange=()=>reportFilters.to=$('reportTo').value;$('reportStatus').onchange=()=>reportFilters.status=$('reportStatus').value;}}
async function action(act,id){try{if(act==='logout')return logout();if(act==='detail')return showRequest(id);if(act==='review')return showReview(id);if(act==='resubmit'){resubmitId=id;page='resubmit';render();return;}if(act==='pdf'){const r=requests.find(x=>x.id===id);if(r)printPDF(r);return;}if(act==='add-user'){editingUser=null;showUserForm();return;}if(act==='edit-user'){editingUser=users.find(x=>x.id===id);showUserForm(editingUser);return;}if(act==='add-employee'){editingEmployee=null;showEmployeeForm();return;}if(act==='template-employees'){return downloadXlsx([{name:'Karyawan',rows:[['NIK','Nama Lengkap','Divisi','Tanggal Masuk Kerja','No. HP','No. HP Darurat','Jabatan'],...Array.from({length:100},()=>Array(7).fill(''))],widths:[20,32,24,24,22,22,22],header:true,noFilter:true}], 'Template_Data_Karyawan.xlsx');}if(act==='export-employees'){return exportEmployees();}if(act==='import-employees'){$('employeeImport')?.click();return;}if(act==='edit-employee'){editingEmployee=employees.find(x=>x.nik===id);showEmployeeForm(editingEmployee);return;}if(act==='filter-report'){reportFilters={from:$('reportFrom').value,to:$('reportTo').value,status:$('reportStatus').value};const d=await api('report','GET',null,reportFilters);reportRows=d.requests;page='reports';render();return;}if(act==='export-report')return exportReport();if(act==='copy-qr'){await navigator.clipboard.writeText(settings.public_url);toast('Link QR disalin.');return;}if(act==='print-qr'){const img=$('root').querySelector('.qrbox img');const w=window.open('','_blank');w.document.write(`<html><head><title>QR Pengajuan Izin</title><style>body{font:16px Arial;text-align:center;padding:40px}img{width:280px}</style></head><body><h2>Scan QR Pengajuan Izin Karyawan</h2><img src="${img.src}"><p>${esc(settings.public_url)}</p></body></html>`);w.document.close();w.print();return;}if(act==='read-all'){await api('mark-notifications','POST',{all:true});await refresh();page='notifications';render();return;}if(act==='read-notice'){await api('mark-notifications','POST',{id});await refresh();page='notifications';render();return;}}catch(e){toast(e.message,true)}}
function showRequest(id){const r=requests.find(x=>x.id===id);if(!r)return;modalRequest=r;$('modalRoot').innerHTML=`<div class="modalback open" id="detailModal"><section class="modal wide"><div class="modalhead"><h3>Detail Pengajuan Izin</h3><button data-close-modal>✕</button></div><div class="modalbody"><div class="statusline">${statusBadge(r.status)} <span class="muted smalltext">ID ${r.id}</span></div><div class="grid2" style="margin-top:15px"><div><span class="muted smalltext">Nama Karyawan</span><div class="name">${esc(r.employee_name)}</div></div><div><span class="muted smalltext">Jabatan / Divisi</span><div class="name">${esc(r.position||'—')} · ${esc(r.division||'—')}</div></div><div><span class="muted smalltext">Tanggal Pengajuan</span><div class="name">${fmtDate(r.request_date)}</div></div><div><span class="muted smalltext">Jam Keluar Otomatis</span><div class="name">${fmtDateTime(r.exit_at)}</div></div><div><span class="muted smalltext">Jam Kembali</span><div class="name">${String(r.return_time||'').slice(0,5)}</div></div><div><span class="muted smalltext">No. WhatsApp</span><div class="name">${esc(r.whatsapp)}</div></div><div class="full"><span class="muted smalltext">Keperluan</span><div>${esc(r.reason)}</div></div></div>${r.status==='ditolak'?`<div class="warn" style="margin-top:14px"><b>Ditolak pada tahap ${r.rejection_stage==='hrd'?'HRD':'Manajer'}.</b><br>${esc(r.rejection_stage==='hrd'?r.hrd_note:r.manager_note)}</div>`:''}<div style="margin-top:18px"><b>Alur persetujuan</b><div class="timeline" id="eventList" style="margin-top:10px"><div class="event"><span class="eventdot"></span><div><b>Dikirim</b><p class="muted smalltext">${fmtDateTime(r.created_at)}</p></div></div><div class="event"><span class="eventdot"></span><div><b>HRD</b><p class="muted smalltext">${r.hrd_reviewed_at?`${esc(r.hrd_note||'Diproses')} · ${fmtDateTime(r.hrd_reviewed_at)}`:'Menunggu verifikasi'}</p></div></div><div class="event"><span class="eventdot"></span><div><b>Manajer</b><p class="muted smalltext">${r.manager_reviewed_at?`${esc(r.manager_note||'Diproses')} · ${fmtDateTime(r.manager_reviewed_at)}`:'Menunggu verifikasi'}</p></div></div></div></div></div><div class="modalfoot"><button data-close-modal>Tutup</button>${r.status==='disetujui'?'<button class="primary" data-modal-act="pdf">Cetak / Simpan PDF</button>':''}${me.role==='employee'&&r.status==='ditolak'?'<button class="primary" data-modal-act="resubmit">Perbaiki & Kirim Ulang</button>':''}${((me.role==='hrd'&&r.status==='menunggu_hrd')||(me.role==='manager'&&r.status==='menunggu_manager'))?'<button class="primary" data-modal-act="review">Verifikasi</button>':''}</div></section></div>`;$('modalRoot').querySelector('[data-close-modal]').onclick=closeModal;$('modalRoot').querySelectorAll('[data-close-modal]').forEach(x=>x.onclick=closeModal);$('modalRoot').querySelector('[data-modal-act="pdf"]')?.addEventListener('click',()=>{closeModal();printPDF(r)});$('modalRoot').querySelector('[data-modal-act="resubmit"]')?.addEventListener('click',()=>{closeModal();resubmitId=r.id;page='resubmit';render()});$('modalRoot').querySelector('[data-modal-act="review"]')?.addEventListener('click',()=>{closeModal();showReview(r.id)});api('events','GET',null,{id}).then(d=>{const box=$('modalRoot').querySelector('#eventList');if(box)box.innerHTML=(d.events||[]).map(ev=>`<div class="event"><span class="eventdot"></span><div><b>${esc(roleLabel[ev.actor_role]||ev.actor_role)} · ${esc(ev.actor_name)}</b><p class="muted smalltext">${esc(ev.action)} · ${esc(statusLabel[ev.to_status]||ev.to_status)} · ${fmtDateTime(ev.created_at)}</p>${ev.note?`<p class="smalltext">${esc(ev.note)}</p>`:''}</div></div>`).join('')||'<span class="muted smalltext">Belum ada riwayat tambahan.</span>';}).catch(()=>{});}
