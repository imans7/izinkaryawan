<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personnel Desk V4.0</title>
<style>
:root{--bg:#f3f6fa;--paper:#fff;--ink:#17293d;--muted:#64758b;--line:#dce4ed;--accent:#146b61;--accent2:#0e554e;--soft:#e7f4f0;--navy:#132e42;--red:#a94442;--green:#16804b;--amber:#a66b12;--shadow:0 5px 18px #19364a0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover{background:#f1f5f8}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--red)}button.small{font-size:12px;padding:6px 9px}input,select,textarea{width:100%;min-width:0;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:var(--ink);padding:10px 11px}textarea{min-height:78px}label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.muted{color:var(--muted)}.smalltext{font-size:12px}.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px max(18px,calc((100vw - 1500px)/2))}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:#2b897b;display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:18px;line-height:1.2;margin:0}.brand p{font-size:11px;color:#b8cbd7;margin:3px 0 0}.topright{display:flex;align-items:center;gap:8px}.topright button{background:#ffffff14;color:#fff;border-color:#ffffff33}.shell{max-width:1500px;margin:auto;padding:22px 18px 40px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px}.sidebar{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;height:max-content;position:sticky;top:14px;box-shadow:var(--shadow)}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8997a8;font-weight:800;padding:8px 10px}.navbtn{width:100%;justify-content:flex-start;background:transparent;border-color:transparent;color:#526579;margin:2px 0;text-align:left}.navbtn.active{background:var(--soft);color:var(--accent2);border-color:#d2e9e2}.content{min-width:0}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:17px}.pagehead h2{margin:0;font-size:23px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}.stat{font-size:28px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1f5;font-size:13px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718197;background:#f8fafc}tr:last-child td{border-bottom:0}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.full{grid-column:1/-1}.badge{display:inline-flex;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:750;background:#edf2f6;color:#526579}.badge.green{background:#e5f6ed;color:#167346}.badge.amber{background:#fff3dd;color:#99620e}.badge.red{background:#fdeceb;color:#a33c36}.badge.blue{background:#e9f1ff;color:#285a9e}.modal{position:fixed;inset:0;background:#10263a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:850px;width:100%;max-height:92vh;overflow:auto;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.notice{padding:12px 14px;border-radius:10px;background:#edf6f4;color:#245b54;font-size:12px}.login{max-width:430px;margin:8vh auto;padding:26px}.hidden{display:none!important}.empty{padding:35px;text-align:center;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.filters input{max-width:310px}.printform{background:#fff;color:#111;padding:24px;max-width:780px;margin:auto;font:13px Arial,sans-serif}.printform h2{text-align:center;text-decoration:underline;font-size:17px;margin:12px 0 22px}.printrows{display:grid;grid-template-columns:300px 16px 1fr;row-gap:7px}.signatures{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #222;margin-top:35px;text-align:center}.signatures>div{border-right:1px solid #222;min-height:135px;padding:7px 3px}.signatures>div:last-child{border:0}.sigspace{height:80px;display:flex;align-items:end;justify-content:center;font-size:11px}.printlogo{max-width:160px;max-height:55px;object-fit:contain}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px}.navlabel{display:none}.navbtn{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.top{padding:12px}.shell{padding:12px}.fieldgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.grid{gap:8px}.card{padding:12px}.topuser{display:none}}
@media print{body{background:white}.modal{position:static;display:block!important;background:white;padding:0}.modalbox{max-width:none;width:100%;max-height:none;overflow:visible;padding:0;border-radius:0;box-shadow:none}.top,.sidebar,.no-print,.modalhead{display:none!important}.shell{display:block;padding:0;margin:0}.content{display:none}.printform{display:block!important;max-width:none;width:100%;padding:12mm 14mm;margin:0}.printrows{grid-template-columns:300px 16px 1fr}.signatures{break-inside:avoid}@page{size:A4 portrait;margin:12mm}}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}.calbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.calh{padding:8px 4px;text-align:center;font-size:12px;font-weight:800;background:#f6f9fb;border-bottom:1px solid var(--line)}.calh.sun,.cald.red .n{color:#c0392b}.cald{min-height:84px;padding:6px 7px;border-right:1px solid #edf1f5;border-bottom:1px solid #edf1f5;cursor:pointer;background:#fff;min-width:0}.cald:nth-child(7n){border-right:0}.cald:hover{background:#f4f9f8}.cald.out{background:#fafbfc}.cald.out .n,.cald.out .hn{opacity:.45}.cald.red{background:#fff7f6}.cald.today .n{background:var(--accent);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center}.cald.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--soft)}.cald .n{font-weight:750;font-size:13px;display:flex;align-items:center;gap:5px}.cald .cnt{font-size:10px;color:var(--muted);font-weight:700}.cald .hn{font-size:10px;color:#c0392b;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cald .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;align-items:center}.cald .dots small{font-size:10px;color:var(--muted)}.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}.selrow{background:var(--soft)}
@media(max-width:700px){.cald{min-height:58px;padding:4px}.cald .hn{display:none}.dot{width:7px;height:7px}}
.modal.wide .modalbox{max-width:1050px}.xlsheet{background:#fff;border:1px solid #bcc7d3;box-shadow:inset 0 0 0 1px #fff;padding:12px 18px 16px;font-family:"Times New Roman",Times,serif;color:#000}.xlhead{display:flex;align-items:center;gap:14px;background:#d9d9d9;border-bottom:2px solid #000;padding:4px 8px}.xlhead img{height:20px}.xlhead h3{margin:0;flex:1;text-align:center;font-size:19px}.xrows{display:grid;grid-template-columns:minmax(220px,38%) 14px 1fr;margin:14px 0 12px;font-size:13px}.xrows>div{border-bottom:1px dotted #444;min-height:22px;padding:1px 2px}.xrows>div:nth-child(3n+1){border-bottom-color:transparent}.xsigs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid #000;font-size:12px;text-align:center}.xsig{padding:6px 4px 8px;border-right:1px solid #000;min-width:0}.xsig:last-child{border-right:0}.xchk{display:flex;align-items:center;justify-content:center;gap:5px;margin:6px 0 2px;font:12px system-ui,sans-serif;font-weight:700;cursor:pointer}.xchk.off{opacity:.55;cursor:not-allowed}.xchk input{width:auto;padding:0}.xbox{height:56px;display:grid;place-items:center;border:1px dashed #b9c4cf;margin:2px 4px 4px}.xbox img,.sigimg{max-height:52px;max-width:100%}.xtabs{display:flex;gap:2px;margin-top:8px;border-top:1px solid #9fb0a8;overflow-x:auto}.xtab{border-radius:0 0 8px 8px;border:1px solid #cfd8e3;border-top:0;background:#eef2f6;font-size:12px;padding:5px 12px;flex-direction:column;gap:0;white-space:nowrap}.xtab span{font-weight:500;color:var(--muted);font-size:10px}.xtab.active{background:#fff;border-bottom:3px solid #1d7a4d;color:#14683f}.sigthumb{height:44px;max-width:150px;background:repeating-conic-gradient(#f1f3f5 0 25%,#fff 0 50%) 0 0/12px 12px;border:1px solid var(--line);border-radius:6px}.sigimg{display:block;margin:0 auto 2px}
</style></head><body>
<div id="loginView" class="card login">
 <div class="brand"><div class="logo">PD</div><div><h1>Personnel Desk <span class="badge green">V4.0</span></h1><p class="muted">Manajemen Form Surat Izin Tidak Masuk</p></div></div>
 <div style="margin-top:22px"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Username"></div>
 <div style="margin-top:12px"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></div>
 <button class="primary" style="width:100%;margin-top:16px" onclick="login()">Masuk</button><p id="loginError" class="smalltext" style="color:#a94442"></p>
</div>
<div id="appView" class="hidden">
<header class="top"><div class="brand"><div class="logo">PD</div><div><h1>Personnel Desk <span style="font-size:11px;color:#9fd6c9">V4.0</span></h1><p>Sistem Informasi Form Surat Izin Tidak Masuk Kerja</p></div></div><div class="topright"><span id="topUser" class="topuser"></span><button onclick="logout()">Keluar</button></div></header>
<div class="shell"><aside class="sidebar" id="nav"></aside><main class="content" id="content"></main></div>
</div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle" style="margin:0">Form</h3><button onclick="closeModal()">Tutup</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);let me=null,employees=[],forms=[],users=[],page='dashboard',editing=null;const CATS=['Cuti','Sakit','Izin','Izin Pulang Cepat'];const catOf=d=>CATS.includes(d?.category)?d.category:'Izin';const catBadge=c=>`<span class="badge ${({'Cuti':'blue','Sakit':'red','Izin':'amber','Izin Pulang Cepat':''})[c]||''}">${esc(c)}</span>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(action,method='GET',data=null)=>{let u='/api/portal?action='+encodeURIComponent(action);const r=await fetch(u,{method,headers:method==='POST'?{'Content-Type':'application/json'}:{},body:method==='POST'?JSON.stringify(data||{}):undefined,credentials:'same-origin'});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||'Permintaan gagal.')}if(action==='form-xlsx')return r.blob();return r.json()};
async function downloadFile(url,fallbackName,mime){let r;try{r=await fetch(url,{credentials:'same-origin'})}catch{return alert('Koneksi gagal.')}if(!r.ok){let x={};try{x=await r.json()}catch{}return alert(x.error||'Gagal mengunduh file.')}const blob=await r.blob();const cd=r.headers.get('Content-Disposition')||'';const name=(cd.match(/filename="([^"]+)"/)||[])[1]||fallbackName;if(window.showSaveFilePicker&&name){try{const ext=name.split('.').pop();const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:{[mime||blob.type||'application/octet-stream']:['.'+ext]}}]});const w=await h.createWritable();await w.write(blob);await w.close();return}catch(e){if(e&&e.name==='AbortError')return}}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show','wide')}
async function login(){try{const x=await api('login','POST',{username:$('loginUser').value,password:$('loginPass').value});me=x.user;await start()}catch(e){$('loginError').textContent=e.message}}
async function logout(){await api('logout','POST',{});location.reload()}
async function start(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('topUser').textContent=me.full_name+' · '+(me.role==='admin'?'Admin':'Eksekutif');await loadAll();render()}
async function loadAll(){const [e,f]=await Promise.all([api('employees'),api('forms')]);employees=e.employees||[];forms=f.forms||[];try{const h=await api('holidays');holidays={};(h.holidays||[]).forEach(x=>holidays[x.day]=x.name)}catch{}if(me.role==='admin'){const u=await api('users');users=u.users||[]}}
function nav(){const items=[['dashboard','▦','Dashboard'],['forms','▤','Form Surat Izin'],['employees','♙','Data Karyawan'],['reports','▥','Laporan']];if(me.role==='admin'){items.push(['executives','♧','Data Eksekutif']);items.push(['signatures','✎','Tanda Tangan']);items.push(['backup','⛁','Backup Data'])}items.push(['profile','⚙','Profil & Password']);$('nav').innerHTML='<div class="navlabel">Menu utama</div>'+items.map(([id,ic,t])=>`<button class="navbtn ${page===id?'active':''}" onclick="go('${id}')">${ic} ${t}</button>`).join('')}
function go(p){page=p;render()}
function statusBadge(signed){return signed?'<span class="badge green">Sudah ditandatangani</span>':'<span class="badge amber">Belum ditandatangani</span>'}
function render(){nav();const c=$('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='forms')c.innerHTML=formsPage();if(page==='employees')c.innerHTML=employeesPage();if(page==='reports')c.innerHTML=reportsPage();if(page==='executives')c.innerHTML=executivesPage();if(page==='backup'&&me.role==='admin')c.innerHTML=backupPage();if(page==='signatures'&&me.role==='admin'){c.innerHTML=signaturesPage();loadSignatures()}if(page==='profile')c.innerHTML=profilePage()}
function dashboard(){const signed=forms.filter(x=>x.is_signed).length;return `<div class="pagehead"><div><div class="eyebrow">Ringkasan</div><h2>Dashboard</h2><div class="muted">Selamat datang, ${esc(me.full_name)}.</div></div>${me.role==='admin'?'<button class="primary" onclick="newForm()">+ Buat Form Surat Izin</button>':''}</div><div class="grid"><div class="card"><div class="muted">Karyawan Aktif</div><div class="stat">${employees.filter(e=>e.active!==false).length}<span class="muted" style="font-size:13px;font-weight:500"> / ${employees.length}</span></div></div><div class="card"><div class="muted">Total Form Izin</div><div class="stat">${forms.length}</div></div><div class="card"><div class="muted">Belum Ditandatangani</div><div class="stat">${forms.length-signed}</div></div><div class="card"><div class="muted">Sudah Ditandatangani</div><div class="stat">${signed}</div></div></div><div class="card" style="margin-top:14px"><div class="row between"><h3 style="margin:0">Form Izin Terbaru</h3><button class="small" onclick="go('forms')">Lihat semua</button></div>${tableForms(forms.slice(0,8))}</div>`}
function tableForms(rows,sel){if(!rows.length)return '<div class="empty">Belum ada form surat izin.</div>';return `<div class="tablewrap" style="margin-top:12px"><table><thead><tr>${sel&&me.role==='admin'?'<th style="width:34px"><input type="checkbox" onchange="toggleSelAll(this.checked)" title="Pilih semua hasil filter"></th>':''}<th>Tanggal Izin</th><th>Nama Karyawan</th><th>Divisi</th><th>Kategori</th><th>Periode Izin</th><th>Status Tanda Tangan</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>{const d=x.data||{};return `<tr>${sel&&me.role==='admin'?`<td><input type="checkbox" ${selForms.has(x.id)?'checked':''} onchange="toggleSel('${x.id}',this.checked)"></td>`:''}<td>${esc(fmt(d.leave_start))}</td><td><b>${esc(d.employee_name)}</b></td><td>${esc(d.division)}</td><td>${catBadge(catOf(d))}</td><td>${esc(fmt(d.leave_start))}${d.leave_end&&d.leave_end!==d.leave_start?' – '+esc(fmt(d.leave_end)):''}${d.leave_time?' · '+esc(d.leave_time):''}</td><td>${statusBadge(x.is_signed)}</td><td><div class="actions"><button class="small" onclick="preview('${x.id}')">Lihat</button>${me.role==='admin'?`<button class="small" onclick="${x.is_signed?`toggleSign('${x.id}',false)`:`signDialog(['${x.id}'])`}">${x.is_signed?'Batalkan tanda tangan':'Tandai ditandatangani'}</button><button class="small" onclick="downloadXlsx('${x.id}')">Excel</button><button class="small danger" onclick="deleteForm('${x.id}')">Hapus</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`}
function formsPage(){return `<div class="pagehead"><div><div class="eyebrow">Dokumen</div><h2>Form Surat Izin Tidak Masuk</h2><div class="muted">${me.role==='admin'?'Admin dapat membuat dan memperbarui status tanda tangan.':'Mode eksekutif: hanya melihat dan mengunduh dokumen.'}</div></div>${me.role==='admin'?'<button class="primary" onclick="newForm()">+ Buat Form Surat Izin</button>':''}</div><div class="filters"><input id="formSearch" placeholder="Cari nama, NIK, divisi..." oninput="filterForms()"><select id="signFilter" onchange="filterForms()" style="max-width:210px"><option value="">Semua status tanda tangan</option><option value="false">Belum ditandatangani</option><option value="true">Sudah ditandatangani</option></select><select id="catFilter" onchange="filterForms()" style="max-width:210px"><option value="">Semua kategori</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="filters" style="align-items:flex-end"><div class="field" style="margin:0"><label>Tanggal izin dari</label><input id="dateFrom" type="date" onchange="filterForms()"></div><div class="field" style="margin:0"><label>Sampai</label><input id="dateTo" type="date" onchange="filterForms()"></div><button onclick="monthFilter()" title="Isi rentang tanggal dengan bulan berjalan">Bulan ini</button><button onclick="resetFormFilter()">Reset</button>${me.role==='admin'?`<button id="selBtn" onclick="signSelected()" ${selForms.size?'':'disabled'}>✔ Tandai Ditandatangani (${selForms.size})</button>`:''}<button class="primary" onclick="downloadForms()" title="Unduh semua surat hasil filter dalam satu file Excel, berurutan dari tanggal paling awal">⬇ Unduh Excel</button><span class="muted" id="formCount"></span></div><div id="formTable">${tableForms(forms,true)}</div>`}
function formFilterValues(){return{q:($('formSearch')?.value||'').trim(),signed:$('signFilter')?.value||'',category:$('catFilter')?.value||'',from:$('dateFrom')?.value||'',to:$('dateTo')?.value||''}}
function filteredForms(){const f=formFilterValues(),q=f.q.toLowerCase();return forms.filter(x=>{const d=x.data||{};return [d.employee_name,d.employee_nik,d.division].join(' ').toLowerCase().includes(q)&&(f.signed===''||String(x.is_signed)===f.signed)&&(f.category===''||catOf(d)===f.category)&&(!f.from||String(d.leave_end||d.leave_start)>=f.from)&&(!f.to||String(d.leave_start)<=f.to)}).sort((a,b)=>String(b.data.leave_start).localeCompare(String(a.data.leave_start)))}
function filterForms(){const a=filteredForms();$('formTable').innerHTML=tableForms(a,true);if($('formCount'))$('formCount').textContent=a.length+' surat'}
function monthFilter(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const p=v=>String(v).padStart(2,'0');$('dateFrom').value=`${y}-${p(m+1)}-01`;$('dateTo').value=`${y}-${p(m+1)}-${p(new Date(y,m+1,0).getDate())}`;filterForms()}
function resetFormFilter(){['formSearch','signFilter','catFilter','dateFrom','dateTo'].forEach(i=>{if($(i))$(i).value=''});filterForms()}
async function downloadForms(){const f=formFilterValues();if(!filteredForms().length)return alert('Tidak ada surat izin pada filter ini.');const qs=new URLSearchParams({action:'forms-xlsx',...Object.fromEntries(Object.entries(f).filter(([,v])=>v))});await downloadFile('/api/portal?'+qs,'Surat-Izin.xlsx',XLSX_MIME)}
function employeesPage(){return `<div class="pagehead"><div><div class="eyebrow">Master data</div><h2>Data Karyawan</h2><div class="muted">Data dapat dilihat Admin dan Eksekutif.</div></div><div class="actions"><button onclick="downloadData()" title="Karyawan, User, dan Surat Izin per karyawan (satu sheet per karyawan)">⬇ Unduh Excel</button>${me.role==='admin'?'<button class="primary" onclick="employeeForm()">+ Tambah Karyawan</button>':''}</div></div><div class="filters"><input id="empSearch" placeholder="Cari NIK, nama, divisi..." oninput="filterEmployees()"><select id="empStatus" onchange="filterEmployees()" style="max-width:190px"><option value="">Semua status</option><option value="aktif">Aktif</option><option value="nonaktif">Nonaktif</option></select></div><div id="empTable">${tableEmployees(employees)}</div>`}

ield"><label>Pengganti sementara</label><select id="fReplacement"><option value="">Tidak ada</option>${employees.filter(e=>e.active!==false).map(e=>`<option value="${esc(e.nik)}">${esc(e.name)} · ${esc(e.division)}</option>`).join('')}</select></div><div class="field"><label>Tanggal Disetujui</label><input id="fApproved" type="date"></div>${signerField('fHrd','Nama HRD',ROLE_RE.hrd,'HRD')}${signerField('fManager','Nama Manager',ROLE_RE.manager,'Manager')}${signerField('fSupervisor','Nama Supervisor',ROLE_RE.supervisor,'Supervisor')}</div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" onclick="closeModal()">Batal</button><button class="primary" type="submit">Simpan & Lihat Surat</button></div></form>`)}

const tabs=sg.ids.map((id,i)=>{const x=forms.find(y=>y.id===id);return `<button class="xtab ${i===sg.active?'active':''}" onclick="sgTab(${i})" title="${esc(x?.data?.employee_name||'')}">Sheet ${i+1}<span>${esc((x?.data?.employee_name||'').slice(0,18))}</span></button>`}).join('');
$('modalTitle').textContent=`Tanda Tangan Digital — ${sg.ids.length} surat`;
$('modalBody').innerHTML=`<div class="muted smalltext" style="margin-bottom:8px">Pratinjau meniru template Excel. Centang kotak TTD pada tiap penandatangan, gambar PNG tanda tangan otomatis masuk ke kolom tersebut dan ikut terunduh di file Excel (satu sheet per karyawan).</div><div class="xlsheet"><div class="xlhead"><img src="/company-logo.jpeg" alt=""><h3>Formulir Pengajuan Ijin tidak masuk kerja</h3></div><div class="xrows">${lines.map(([a,b])=>`<div>${esc(a)}</div><div>:</div><div>${esc(b||'')}</div>`).join('')}<div>(Di isi oleh HRD)</div><div></div><div></div></div><div class="xsigs">${cells}</div></div><div class="xtabs">${tabs}</div><div class="row between" style="margin-top:14px;gap:10px;flex-wrap:wrap"><span class="smalltext muted">Sheet ${sg.active+1}/${sg.ids.length} · ${checked}/5 kotak TTD tercentang · ${statusBadge(f.is_signed)}</span><div class="actions"><button onclick="downloadSheets()">⬇ Unduh Excel (per sheet)</button><button class="primary" onclick="sgFinish()">Tandai Selesai Ditandatangani</button></div></div>`}
async function sgToggle(id,slot,on){const f=forms.find(x=>x.id===id);const slots={...(f.data.signatures||{}),[slot]:on};try{const x=await api('form-slots','POST',{id,slots});const i=forms.findIndex(y=>y.id===id);forms[i]={...forms[i],...x.form}}catch(e){alert(e.message)}renderSign()}
function sgUpload(name){const i=document.createElement('input');i.type='file';i.accept='image/png';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{await uploadSignature(name,f);sg.lib.add(nk(name));if(page==='signatures')loadSignatures();else renderSign()}catch(e){alert(e.message)}};i.click()}
async function uploadSignature(name,file){if(file.type!=='image/png')throw new Error('File harus berformat PNG (disarankan latar transparan).');if(file.size>300*1024)throw new Error('Ukuran PNG maksimal 300 KB.');await api('signature-save','POST',{name,image:await readDataURL(file)})}
async function downloadSheets(){await downloadFile('/api/portal?action=forms-sheets-xlsx&ids='+sg.ids.map(encodeURIComponent).join(','),'Surat-Izin-Tanda-Tangan.xlsx',XLSX_MIME)}
async function sgFinish(){const open=sg.ids.map(id=>forms.find(x=>x.id===id)).filter(Boolean);const missing=open.filter(f=>SIG_ROLES.some(r=>!(f.data.signatures||{})[r[0]])).length;if(!confirm(missing?`${missing} surat masih punya kotak TTD yang belum dicentang. Tetap tandai selesai ditandatangani?`:`Tandai ${open.length} surat sebagai sudah ditandatangani?`))return;try{for(const f of open)if(!f.is_signed)await api('form-sign','POST',{id:f.id,is_signed:true});selForms.clear();closeModal();await loadAll();render()}catch(e){alert(e.message)}}

/* ---------- Halaman Tanda Tangan (pustaka PNG) ---------- */
function signaturesPage(){const names=[...new Set(employees.map(e=>e.name))].sort((a,b)=>a.localeCompare(b,'id'));return `<div class="pagehead"><div><div class="eyebrow">Dokumen</div><h2>Pustaka Tanda Tangan</h2><div class="muted">Unggah gambar PNG tanda tangan per orang (HRD, Manager, Supervisor, Pengganti, Karyawan). Dipakai saat mencentang kotak TTD.</div></div></div><div class="card"><div class="fieldgrid"><div class="field"><label>Nama penandatangan</label><input id="sgName" list="sgNames" autocomplete="off" placeholder="Pilih atau ketik nama (harus sama dengan nama di surat)"><datalist id="sgNames">${names.map(n=>`<option value="${esc(n)}"></option>`).join('')}</datalist></div><div class="field"><label>File PNG (maks. 300 KB, latar transparan disarankan)</label><input id="sgFile" type="file" accept="image/png"></div></div><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="primary" onclick="saveSignature()">Simpan TTD</button></div></div><div class="card" style="margin-top:14px"><div id="sgList"><div class="empty">Memuat…</div></div></div>`}
async function saveSignature(){const n=$('sgName').value.trim(),f=$('sgFile').files[0];if(!n||!f)return alert('Isi nama dan pilih file PNG.');try{await uploadSignature(n,f);$('sgName').value='';$('sgFile').value='';loadSignatures()}catch(e){alert(e.message)}}
async function loadSignatures(){try{const x=await api('signatures');sg.lib=new Set((x.signatures||[]).map(s=>s.name_key));const el=$('sgList');if(!el)return;el.innerHTML=(x.signatures||[]).length?`<div class="tablewrap"><table><thead><tr><th>Nama</th><th>Tanda tangan</th><th>Diperbarui</th><th>Aksi</th></tr></thead><tbody>${x.signatures.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${sigImg(s.name,'sigthumb')}</td><td>${esc(fmt(s.updated_at))}</td><td><div class="actions"><button class="small" onclick="sgUpload('${esc(s.name).replace(/'/g,'&#39;')}')">Ganti</button><button class="small danger" onclick="deleteSignature('${esc(s.name).replace(/'/g,'&#39;')}')">Hapus</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada tanda tangan. Unggah PNG di atas.</div>'}catch(e){if($('sgList'))$('sgList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
async function deleteSignature(name){if(!confirm(`Hapus TTD ${name}? Surat yang sudah dicentang tidak akan menampilkan gambar lagi.`))return;try{await api('signature-delete','POST',{name});loadSignatures()}catch(e){alert(e.message)}}

/* ---------- Laporan: kalender ---------- */
function reportsPage(){const signed=forms.filter(x=>x.is_signed).length;const adm=me.role==='admin';return `<div class="pagehead"><div><div class="eyebrow">Analitik</div><h2>Laporan Form Izin</h2><div class="muted">Kalender izin, cuti, dan sakit berdasarkan tanggal mulai izin.</div></div><div class="actions"><button onclick="exportReport()">⬇ Export Excel</button>${adm?'<button onclick="importDialog()">⬆ Import Excel</button>':''}</div></div><div class="grid"><div class="card"><div class="muted">Total Form</div><div class="stat">${forms.length}</div></div><div class="card"><div class="muted">Sudah TTD</div><div class="stat">${signed}</div></div><div class="card"><div class="muted">Belum TTD</div><div class="stat">${forms.length-signed}</div></div><div class="card"><div class="muted">Total Karyawan</div><div class="stat">${employees.length}</div></div></div><div class="grid" style="margin-top:13px">${CATS.map(c=>`<div class="card"><div class="muted"><span class="dot" style="background:${CAT_COLOR[c]}"></span> ${c}</div><div class="stat">${forms.filter(x=>catOf(x.data)===c).length}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><div id="calWrap">${calendarHTML()}</div></div><div class="card" style="margin-top:14px" id="calDetail">${dayDetailHTML()}</div>`}
function calForms(){const q=calQ.toLowerCase();return forms.filter(x=>{const d=x.data||{};return(!q||[d.employee_name,d.employee_nik,d.division].join(' ').toLowerCase().includes(q))&&(!calCat||catOf(d)===calCat)})}
function coverFor(ds){return calForms().filter(x=>{const d=x.data||{};return d.leave_start<=ds&&(d.leave_end||d.leave_start)>=ds}).sort((a,b)=>String(a.data.employee_name).localeCompare(String(b.data.employee_name),'id'))}
function calendarHTML(){const first=new Date(Date.UTC(calY,calM,1)),w=first.getUTCDay(),dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(),cells=Math.ceil((w+dim)/7)*7;const today=new Date();const tds=`${today.getFullYear()}-${pad2(today.getMonth()+1)}-${pad2(today.getDate())}`;const list=calForms();const byDay={};
const gs=new Date(Date.UTC(calY,calM,1-w)),gsS=gs.toISOString().slice(0,10),geS=new Date(Date.UTC(calY,calM,1-w+cells-1)).toISOString().slice(0,10);
for(const x of list){const d=x.data||{};let s=d.leave_start,e=d.leave_end||d.leave_start;if(!s||e<gsS||s>geS)continue;if(s<gsS)s=gsS;if(e>geS)e=geS;let cur=new Date(s+'T00:00:00Z'),n=0;while(cur.toISOString().slice(0,10)<=e&&n++<62){const k=cur.toISOString().slice(0,10);(byDay[k]=byDay[k]||[]).push(x);cur=new Date(cur.getTime()+864e5)}}
let grid=DAY_ID.map((n,i)=>`<div class="calh ${i===0?'sun':''}">${n.slice(0,3)}</div>`).join('');
for(let i=0;i<cells;i++){const dt=new Date(Date.UTC(calY,calM,1-w+i)),ds=dt.toISOString().slice(0,10),dow=dt.getUTCDay(),out=dt.getUTCMonth()!==calM,hol=holidays[ds],fs=byDay[ds]||[];const dots=fs.slice(0,8).map(x=>`<i class="dot" style="background:${CAT_COLOR[catOf(x.data)]}" title="${esc(x.data.employee_name)} · ${catOf(x.data)}"></i>`).join('')+(fs.length>8?`<small>+${fs.length-8}</small>`:'');grid+=`<div class="cald ${out?'out':''} ${dow===0||hol?'red':''} ${ds===tds?'today':''} ${ds===calSel?'sel':''}" onclick="selectDay('${ds}')"><div class="n">${dt.getUTCDate()}${fs.length?`<span class="cnt">${fs.length}</span>`:''}</div>${hol?`<div class="hn" title="${esc(hol)}">${esc(hol)}</div>`:''}<div class="dots">${dots}</div></div>`}
const mh=Object.keys(holidays).filter(k=>k.startsWith(`${calY}-${pad2(calM+1)}`)).sort();
return `<div class="calbar"><div class="actions"><button class="small" onclick="calMove(-1)">◀</button><h3 style="margin:0;min-width:150px;text-align:center">${MONTH_ID[calM]} ${calY}</h3><button class="small" onclick="calMove(1)">▶</button><button class="small" onclick="calToday()">Hari ini</button></div><div class="actions"><input id="calSearch" value="${esc(calQ)}" placeholder="Cari karyawan / divisi" oninput="calQ=this.value;calRefresh(true)" style="width:190px"><select id="calCatSel" onchange="calCat=this.value;calRefresh()" style="width:170px"><option value="">Semua kategori</option>${CATS.map(c=>`<option ${calCat===c?'selected':''}>${c}</option>`).join('')}</select><button class="small" onclick="downloadMonth()" title="Satu file Excel berisi semua surat pada bulan ini, berurutan dari atas ke bawah">⬇ Excel bulan ini</button></div></div><div class="cal">${grid}</div><div class="legend">${CATS.map(c=>`<span><i class="dot" style="background:${CAT_COLOR[c]}"></i> ${c}</span>`).join('')}<span><b style="color:#c0392b">Merah</b> = Minggu / tanggal merah</span></div>${mh.length?`<div class="legend">Tanggal merah bulan ini: ${mh.map(k=>`<span class="badge red">${+k.slice(8)} ${esc(holidays[k])}${me.role==='admin'?` <a href="#" onclick="removeHoliday('${k}');return false" style="color:inherit">×</a>`:''}</span>`).join(' ')}</div>`:''}`}
function calRefresh(keepFocus){const el=$('calWrap');if(!el)return;const had=keepFocus&&document.activeElement&&document.activeElement.id==='calSearch';el.innerHTML=calendarHTML();$('calDetail').innerHTML=dayDetailHTML();if(had){const i=$('calSearch');i.focus();i.setSelectionRange(i.value.length,i.value.length)}}
function calMove(n){calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}calRefresh()}
function calToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();calSel=`${calY}-${pad2(calM+1)}-${pad2(n.getDate())}`;calForm='';calRefresh()}
function selectDay(ds){calSel=ds;calForm='';const y=+ds.slice(0,4),m=+ds.slice(5,7)-1;if(y!==calY||m!==calM){calY=y;calM=m}calRefresh()}
function selectCalForm(id){calForm=calForm===id?'':id;calRefresh();if(calForm)setTimeout(()=>$('calPreview')?.scrollIntoView({behavior:'smooth',block:'start'}),50)}
function dayDetailHTML(){if(!calSel)return '<div class="empty">Pilih tanggal pada kalender.</div>';const dt=new Date(calSel+'T00:00:00Z'),hol=holidays[calSel],list=coverFor(calSel),adm=me.role==='admin';
let h=`<div class="row between" style="gap:10px;flex-wrap:wrap"><div><h3 style="margin:0">${DAY_ID[dt.getUTCDay()]}, ${dt.getUTCDate()} ${MONTH_ID[dt.getUTCMonth()]} ${dt.getUTCFullYear()}</h3>${hol?`<span class="badge red">Tanggal merah: ${esc(hol)}</span>`:dt.getUTCDay()===0?'<span class="badge red">Hari Minggu</span>':''}</div>${adm?(hol?`<button class="small danger" onclick="removeHoliday('${calSel}')">Hapus tanggal merah</button>`:`<button class="small" onclick="setHoliday('${calSel}')">Tandai tanggal merah</button>`):''}</div>`;
h+=list.length?`<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Karyawan</th><th>Divisi</th><th>Kategori</th><th>Periode</th><th>Status TTD</th><th></th></tr></thead><tbody>${list.map(x=>{const d=x.data;return `<tr class="${x.id===calForm?'selrow':''}"><td><b>${esc(d.employee_name)}</b></td><td>${esc(d.division)}</td><td>${catBadge(catOf(d))}</td><td>${esc(fmt(d.leave_start))}${d.leave_end&&d.leave_end!==d.leave_start?' – '+esc(fmt(d.leave_end)):''}${d.leave_time?' · '+esc(d.leave_time):''}</td><td>${statusBadge(x.is_signed)}</td><td><button class="small" onclick="selectCalForm('${x.id}')">${x.id===calForm?'Tutup pratinjau':'Pratinjau'}</button></td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada karyawan izin / cuti / sakit pada tanggal ini.</div>';
const f=calForm&&forms.find(x=>x.id===calForm);if(f)h+=`<div id="calPreview" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:8px">Pratinjau surat izin</div>${previewHTML(f)}<div class="actions" style="justify-content:flex-end;margin-top:12px"><button onclick="preview('${f.id}')">Layar penuh / Cetak</button>${adm?`<button onclick="signDialog(['${f.id}'])">Tandai Ditandatangani</button>`:''}<button class="primary" onclick="downloadXlsx('${f.id}')">⬇ Unduh Excel (.xlsx)</button></div></div>`;return h}
async function setHoliday(ds){const n=prompt('Nama hari libur / tanggal merah untuk '+fmt(ds)+' (mis. Hari Kemerdekaan):');if(n==null)return;if(!n.trim())return alert('Nama wajib diisi.');try{await api('holiday-save','POST',{day:ds,name:n.trim()});holidays[ds]=n.trim();calRefresh()}catch(e){alert(e.message)}}
async function removeHoliday(ds){if(!confirm('Hapus tanggal merah '+fmt(ds)+'?'))return;try{await api('holiday-delete','POST',{day:ds});delete holidays[ds];calRefresh()}catch(e){alert(e.message)}}
async function downloadMonth(){const from=`${calY}-${pad2(calM+1)}-01`,to=`${calY}-${pad2(calM+1)}-${pad2(new Date(Date.UTC(calY,calM+1,0)).getUTCDate())}`;if(!calForms().some(x=>x.data.leave_start<=to&&(x.data.leave_end||x.data.leave_start)>=from))return alert('Tidak ada surat izin pada bulan ini.');const qs=new URLSearchParams({action:'forms-xlsx',from,to});if(calQ)qs.set('q',calQ);if(calCat)qs.set('category',calCat);await downloadFile('/api/portal?'+qs,'Surat-Izin.xlsx',XLSX_MIME)}

/* ---------- Import Excel ---------- */
function importDialog(){impFile='';openModal('Import Data Izin / Cuti Lama',`<div class="muted" style="margin-bottom:10px">Unggah file Excel (.xlsx) berisi data izin/cuti lama. Karyawan harus sudah ada di Data Karyawan. Surat yang sama dilewati otomatis, jadi aman bila diunggah ulang.</div><div class="actions" style="margin-bottom:12px"><button onclick="downloadFile('/api/portal?action=import-template','Template-Import-Izin.xlsx',XLSX_MIME)">⬇ Unduh template import</button></div><div class="field"><label>File Excel</label><input id="impInput" type="file" accept=".xlsx"></div><div class="actions" style="justify-content:flex-end;margin-top:10px"><button class="primary" onclick="importCheck()">Periksa file</button></div><div id="impResult" style="margin-top:14px"></div>`)}
async function importCheck(){const f=$('impInput').files[0];if(!f)return alert('Pilih file .xlsx terlebih dahulu.');if(f.size>3*1024*1024)return alert('Ukuran file maksimal 3 MB.');$('impResult').innerHTML='<div class="muted">Memeriksa…</div>';try{impFile=await readDataURL(f);const x=await api('forms-import-parse','POST',{file:impFile});$('impResult').innerHTML=`<div class="grid"><div class="card"><div class="muted">Siap diimpor</div><div class="stat">${x.valid}</div></div><div class="card"><div class="muted">Sudah ada (dilewati)</div><div class="stat">${x.skipped}</div></div><div class="card"><div class="muted">Bermasalah</div><div class="stat" style="color:var(--red)">${x.errorCount}</div></div></div>${x.sample.length?`<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Baris</th><th>Karyawan</th><th>Kategori</th><th>Periode</th><th>Keperluan</th></tr></thead><tbody>${x.sample.map(r=>`<tr><td>${r.row}</td><td>${esc(r.employee_name)}</td><td>${catBadge(r.category)}</td><td>${esc(fmt(r.leave_start))}${r.leave_end!==r.leave_start?' – '+esc(fmt(r.leave_end)):''}</td><td>${esc(r.purpose)}</td></tr>`).join('')}</tbody></table></div><div class="muted smalltext">Menampilkan ${x.sample.length} contoh baris pertama.</div>`:''}${x.errors.length?`<div class="notice" style="margin-top:12px;max-height:180px;overflow:auto"><b>Baris bermasalah (tidak akan diimpor):</b><br>${x.errors.map(e=>`Baris ${e.row}: ${esc(e.error)}`).join('<br>')}</div>`:''}<div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="primary" ${x.valid?'':'disabled'} onclick="importCommit(${x.valid})">Impor ${x.valid} surat</button></div>`}catch(e){$('impResult').innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
async function importCommit(n){if(!confirm(`Impor ${n} surat izin ke sistem?`))return;try{const x=await api('forms-import-commit','POST',{file:impFile});closeModal();await loadAll();render();alert(`Berhasil mengimpor ${x.imported} surat. Dilewati (sudah ada): ${x.skipped}. Bermasalah: ${x.errorCount}.`)}catch(e){alert(e.message)}}

</script></body></html>
