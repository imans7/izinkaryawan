<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personnel Desk V4.0</title>
<style>
:root{--bg:#f3f6fa;--paper:#fff;--ink:#17293d;--muted:#64758b;--line:#dce4ed;--accent:#146b61;--accent2:#0e554e;--soft:#e7f4f0;--navy:#132e42;--red:#a94442;--green:#16804b;--amber:#a66b12;--shadow:0 5px 18px #19364a0a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:9px 13px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover{background:#f1f5f8}button:disabled{opacity:.5;cursor:not-allowed}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--red)}button.small{font-size:12px;padding:6px 9px}input,select,textarea{width:100%;min-width:0;border:1px solid #cbd6e2;border-radius:8px;background:#fff;color:var(--ink);padding:10px 11px}textarea{min-height:78px}label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.muted{color:var(--muted)}.smalltext{font-size:12px}.top{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px max(18px,calc((100vw - 1500px)/2))}.brand{display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:12px;background:#2b897b;display:grid;place-items:center;font-weight:900;font-size:19px}.brand h1{font-size:18px;line-height:1.2;margin:0}.brand p{font-size:11px;color:#b8cbd7;margin:3px 0 0}.topright{display:flex;align-items:center;gap:8px}.topright button{background:#ffffff14;color:#fff;border-color:#ffffff33}.shell{max-width:1500px;margin:auto;padding:22px 18px 40px;display:grid;grid-template-columns:235px minmax(0,1fr);gap:18px}.sidebar{background:white;border:1px solid var(--line);border-radius:14px;padding:13px;height:max-content;position:sticky;top:14px;box-shadow:var(--shadow)}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8997a8;font-weight:800;padding:8px 10px}.navbtn{width:100%;justify-content:flex-start;background:transparent;border-color:transparent;color:#526579;margin:2px 0;text-align:left}.navbtn.active{background:var(--soft);color:var(--accent2);border-color:#d2e9e2}.content{min-width:0}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:17px}.pagehead h2{margin:0;font-size:23px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--accent);font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}.stat{font-size:28px;font-weight:800;margin-top:5px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid #edf1f5;font-size:13px;vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718197;background:#f8fafc}tr:last-child td{border-bottom:0}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{min-width:0}.full{grid-column:1/-1}.badge{display:inline-flex;border-radius:30px;padding:4px 9px;font-size:11px;font-weight:750;background:#edf2f6;color:#526579}.badge.green{background:#e5f6ed;color:#167346}.badge.amber{background:#fff3dd;color:#99620e}.badge.red{background:#fdeceb;color:#a33c36}.badge.blue{background:#e9f1ff;color:#285a9e}.modal{position:fixed;inset:0;background:#10263a88;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{background:#fff;border-radius:16px;max-width:850px;width:100%;max-height:92vh;overflow:auto;padding:20px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.notice{padding:12px 14px;border-radius:10px;background:#edf6f4;color:#245b54;font-size:12px}.login{max-width:430px;margin:8vh auto;padding:26px}.hidden{display:none!important}.empty{padding:35px;text-align:center;color:var(--muted)}.actions{display:flex;gap:7px;flex-wrap:wrap}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.filters input{max-width:310px}.printform{background:#fff;color:#111;padding:24px;max-width:780px;margin:auto;font:13px Arial,sans-serif}.printform h2{text-align:center;text-decoration:underline;font-size:17px;margin:12px 0 22px}.printrows{display:grid;grid-template-columns:300px 16px 1fr;row-gap:7px}.signatures{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid #222;margin-top:35px;text-align:center}.signatures>div{border-right:1px solid #222;min-height:135px;padding:7px 3px}.signatures>div:last-child{border:0}.sigspace{height:80px;display:flex;align-items:end;justify-content:center;font-size:11px}.printlogo{max-width:160px;max-height:55px;object-fit:contain}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow:auto;gap:5px}.navlabel{display:none}.navbtn{width:auto;white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.top{padding:12px}.shell{padding:12px}.fieldgrid{grid-template-columns:1fr}.full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.grid{gap:8px}.card{padding:12px}.topuser{display:none}}
@media print{body{background:white}.modal{position:static;display:block!important;background:white;padding:0}.modalbox{max-width:none;width:100%;max-height:none;overflow:visible;padding:0;border-radius:0;box-shadow:none}.top,.sidebar,.no-print,.modalhead{display:none!important}.shell{display:block;padding:0;margin:0}.content{display:none}.printform{display:block!important;max-width:none;width:100%;padding:12mm 14mm;margin:0}.printrows{grid-template-columns:300px 16px 1fr}.signatures{break-inside:avoid}@page{size:A4 portrait;margin:12mm}}
</style></head><body>
<div id="loginView" class="card login">
 <div class="brand"><div class="logo">PD</div><div><h1>Personnel Desk <span class="badge green">V4.0</span></h1><p class="muted">Manajemen Form Surat Izin Tidak Masuk</p></div></div>
 <div style="margin-top:22px"><label>Username</label><input id="loginUser" autocomplete="username" placeholder="Username"></div>
 <div style="margin-top:12px"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Password"></div>
 <button class="primary" style="width:100%;margin-top:16px" onclick="login()">Masuk</button><p id="loginError" class="smalltext" style="color:#a94442"></p>
</div>
<div id="appView" class="hidden">
<header class="top"><div class="brand"><div class="logo">PD</div><div><h1>Personnel Desk <span style="font-size:11px;color:#9fd6c9">V4.0</span></h1><p>Sistem Informasi Form Surat Izin Tidak Masuk Kerja</p></div></div><div class="topright"><span id="topUser" class="topuser"></span><button onclick="logout()">Keluar</button></div></header>
<div class="shell"><aside class="sidebar" id="nav"></aside><main class="content" id="content"></main></div>
</div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle" style="margin:0">Form</h3><button onclick="closeModal()">Tutup</button></div><div id="modalBody"></div></div></div>
<script>
const $=id=>document.getElementById(id);let me=null,employees=[],forms=[],users=[],page='dashboard',editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(action,method='GET',data=null)=>{let u='/api/portal?action='+encodeURIComponent(action);const r=await fetch(u,{method,headers:method==='POST'?{'Content-Type':'application/json'}:{},body:method==='POST'?JSON.stringify(data||{}):undefined,credentials:'same-origin'});if(!r.ok){let j={};try{j=await r.json()}catch{}throw Error(j.error||'Permintaan gagal.')}if(action==='form-xlsx')return r.blob();return r.json()};
function openModal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}
async function login(){try{const x=await api('login','POST',{username:$('loginUser').value,password:$('loginPass').value});me=x.user;await start()}catch(e){$('loginError').textContent=e.message}}
async function logout(){await api('logout','POST',{});location.reload()}
async function start(){ $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('topUser').textContent=me.full_name+' · '+(me.role==='admin'?'Admin':'Eksekutif');await loadAll();render()}
async function loadAll(){const [e,f]=await Promise.all([api('employees'),api('forms')]);employees=e.employees||[];forms=f.forms||[];if(me.role==='admin'){const u=await api('users');users=u.users||[]}}
function nav(){const items=[['dashboard','▦','Dashboard'],['forms','▤','Form Surat Izin'],['employees','♙','Data Karyawan'],['reports','▥','Laporan']];if(me.role==='admin')items.push(['executives','♧','Data Eksekutif']);items.push(['profile','⚙','Profil & Password']);$('nav').innerHTML='<div class="navlabel">Menu utama</div>'+items.map(([id,ic,t])=>`<button class="navbtn ${page===id?'active':''}" onclick="go('${id}')">${ic} ${t}</button>`).join('')}
function go(p){page=p;render()}
function statusBadge(signed){return signed?'<span class="badge green">Sudah ditandatangani</span>':'<span class="badge amber">Belum ditandatangani</span>'}
function render(){nav();const c=$('content');if(page==='dashboard')c.innerHTML=dashboard();if(page==='forms')c.innerHTML=formsPage();if(page==='employees')c.innerHTML=employeesPage();if(page==='reports')c.innerHTML=reportsPage();if(page==='executives')c.innerHTML=executivesPage();if(page==='profile')c.innerHTML=profilePage()}
function dashboard(){const signed=forms.filter(x=>x.is_signed).length;return `<div class="pagehead"><div><div class="eyebrow">Ringkasan</div><h2>Dashboard</h2><div class="muted">Selamat datang, ${esc(me.full_name)}.</div></div>${me.role==='admin'?'<button class="primary" onclick="newForm()">+ Buat Form Surat Izin</button>':''}</div><div class="grid"><div class="card"><div class="muted">Total Karyawan</div><div class="stat">${employees.length}</div></div><div class="card"><div class="muted">Total Form Izin</div><div class="stat">${forms.length}</div></div><div class="card"><div class="muted">Belum Ditandatangani</div><div class="stat">${forms.length-signed}</div></div><div class="card"><div class="muted">Sudah Ditandatangani</div><div class="stat">${signed}</div></div></div><div class="card" style="margin-top:14px"><div class="row between"><h3 style="margin:0">Form Izin Terbaru</h3><button class="small" onclick="go('forms')">Lihat semua</button></div>${tableForms(forms.slice(0,8))}</div>`}
function tableForms(rows){if(!rows.length)return '<div class="empty">Belum ada form surat izin.</div>';return `<div class="tablewrap" style="margin-top:12px"><table><thead><tr><th>Tanggal</th><th>Nama Karyawan</th><th>Divisi</th><th>Periode Izin</th><th>Status Tanda Tangan</th><th>Aksi</th></tr></thead><tbody>${rows.map(x=>{const d=x.data||{};return `<tr><td>${esc(fmt(d.application_date))}</td><td><b>${esc(d.employee_name)}</b></td><td>${esc(d.division)}</td><td>${esc(fmt(d.leave_start))} – ${esc(fmt(d.leave_end))}</td><td>${statusBadge(x.is_signed)}</td><td><div class="actions"><button class="small" onclick="preview('${x.id}')">Lihat</button>${me.role==='admin'?`<button class="small" onclick="toggleSign('${x.id}',${!x.is_signed})">${x.is_signed?'Batalkan tanda tangan':'Tandai ditandatangani'}</button><button class="small" onclick="downloadXlsx('${x.id}')">Excel</button>`:''}</div></td></tr>`}).join('')}</tbody></table></div>`}
function formsPage(){return `<div class="pagehead"><div><div class="eyebrow">Dokumen</div><h2>Form Surat Izin Tidak Masuk</h2><div class="muted">${me.role==='admin'?'Admin dapat membuat dan memperbarui status tanda tangan.':'Mode eksekutif: hanya melihat dan mengunduh dokumen.'}</div></div>${me.role==='admin'?'<button class="primary" onclick="newForm()">+ Buat Form Surat Izin</button>':''}</div><div class="filters"><input id="formSearch" placeholder="Cari nama, NIK, divisi..." oninput="filterForms()"><select id="signFilter" onchange="filterForms()" style="max-width:210px"><option value="">Semua status tanda tangan</option><option value="false">Belum ditandatangani</option><option value="true">Sudah ditandatangani</option></select></div><div id="formTable">${tableForms(forms)}</div>`}
function filterForms(){const q=($('formSearch')?.value||'').toLowerCase(),s=$('signFilter')?.value||'';const a=forms.filter(x=>{const d=x.data||{};return [d.employee_name,d.employee_nik,d.division].join(' ').toLowerCase().includes(q)&&(s===''||String(x.is_signed)===s)});$('formTable').innerHTML=tableForms(a)}
function employeesPage(){return `<div class="pagehead"><div><div class="eyebrow">Master data</div><h2>Data Karyawan</h2><div class="muted">Data dapat dilihat Admin dan Eksekutif.</div></div>${me.role==='admin'?'<button class="primary" onclick="employeeForm()">+ Tambah Karyawan</button>':''}</div><div class="filters"><input id="empSearch" placeholder="Cari NIK, nama, divisi..." oninput="filterEmployees()"></div><div id="empTable">${tableEmployees(employees)}</div>`}
function tableEmployees(rows){return `<div class="tablewrap"><table><thead><tr><th>NIK</th><th>Nama</th><th>Jabatan</th><th>Divisi</th><th>Tanggal Masuk</th><th>No. HP</th>${me.role==='admin'?'<th>Aksi</th>':''}</tr></thead><tbody>${rows.map(e=>`<tr><td>${esc(e.nik)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.position)}</td><td>${esc(e.division)}</td><td>${esc(fmt(e.join))}</td><td>${esc(e.phone)}</td>${me.role==='admin'?`<td><button class="small" onclick="employeeForm('${esc(e.nik)}')">Edit</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function filterEmployees(){const q=$('empSearch').value.toLowerCase();$('empTable').innerHTML=tableEmployees(employees.filter(e=>[e.nik,e.name,e.division,e.position].join(' ').toLowerCase().includes(q)))}
function reportsPage(){return `<div class="pagehead"><div><div class="eyebrow">Analitik</div><h2>Laporan Form Izin</h2><div class="muted">Ringkasan seluruh dokumen izin dan status tanda tangan.</div></div><button onclick="exportReport()">Export Excel</button></div><div class="grid"><div class="card"><div class="muted">Total Form</div><div class="stat">${forms.length}</div></div><div class="card"><div class="muted">Sudah TTD</div><div class="stat">${forms.filter(x=>x.is_signed).length}</div></div><div class="card"><div class="muted">Belum TTD</div><div class="stat">${forms.filter(x=>!x.is_signed).length}</div></div><div class="card"><div class="muted">Total Karyawan</div><div class="stat">${employees.length}</div></div></div><div class="card" style="margin-top:14px">${tableForms(forms)}</div>`}
function executivesPage(){return `<div class="pagehead"><div><div class="eyebrow">Pengguna sistem</div><h2>Data Eksekutif</h2><div class="muted">Hanya Admin yang dapat membuat dan mengelola akun Eksekutif.</div></div><button class="primary" onclick="executiveForm()">+ Buat Akun Eksekutif</button></div><div class="tablewrap"><table><thead><tr><th>Nama</th><th>Username</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${users.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td>Eksekutif</td><td>${u.is_active?'<span class="badge green">Aktif</span>':'<span class="badge red">Nonaktif</span>'}</td><td><button class="small" onclick="executiveForm('${u.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div>`}
function profilePage(){return `<div class="pagehead"><div><div class="eyebrow">Akun</div><h2>Profil & Password</h2></div></div><div class="card" style="max-width:650px"><h3>Profil</h3><label>Nama lengkap</label><input id="profileName" value="${esc(me.full_name)}"><button class="primary" style="margin-top:10px" onclick="saveProfile()">Simpan Profil</button><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3>Ubah Password</h3><div class="fieldgrid"><div class="field"><label>Password saat ini</label><input type="password" id="oldPass"></div><div class="field"><label>Password baru (minimal 12 karakter)</label><input type="password" id="newPass"></div></div><button class="primary" style="margin-top:12px" onclick="changePass()">Ubah Password</button></div>`}
function newForm(){if(me.role!=='admin')return;const opts=employees.filter(e=>e.active!==false).map(e=>`<option value="${esc(e.nik)}">${esc(e.name)} · ${esc(e.division)}</option>`).join('');openModal('Buat Form Surat Izin Tidak Masuk',`<div class="notice" style="margin-bottom:14px">Pilih karyawan dari master data. Identitas karyawan akan terisi otomatis. Surat dapat langsung dicetak atau diunduh sebagai Excel.</div><form id="formCreate" onsubmit="saveForm(event)"><div class="fieldgrid"><div class="field full"><label>Nama Karyawan *</label><select id="fNik" required onchange="fillEmployee()"><option value="">Pilih karyawan...</option>${opts}</select></div><div class="field"><label>NIK / No. Absen</label><input id="fNo" readonly></div><div class="field"><label>Jabatan</label><input id="fPosition" readonly></div><div class="field"><label>Tanggal Pengajuan *</label><input id="fApplication" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Tanggal Masuk Kerja</label><input id="fJoin" readonly></div><div class="field"><label>Divisi</label><input id="fDivision" readonly></div><div class="field"><label>No. Telepon / HP</label><input id="fPhone" readonly></div><div class="field"><label>No. Telepon lain yang dapat dihubungi</label><input id="fOther" placeholder="Opsional"></div><div class="field"><label>Tanggal Izin Mulai *</label><input id="fStart" type="date" required></div><div class="field"><label>Tanggal Izin Selesai *</label><input id="fEnd" type="date" required></div><div class="field full"><label>Keperluan *</label><textarea id="fPurpose" required></textarea></div><div class="field"><label>Pengganti sementara</label><select id="fReplacement"><option value="">Tidak ada</option>${employees.filter(e=>e.active!==false).map(e=>`<option value="${esc(e.nik)}">${esc(e.name)} · ${esc(e.division)}</option>`).join('')}</select></div><div class="field"><label>Tanggal Disetujui</label><input id="fApproved" type="date"></div><div class="field"><label>Nama HRD</label><input id="fHrd" placeholder="Nama HRD"></div><div class="field"><label>Nama Manager</label><input id="fManager" placeholder="Nama Manager"></div><div class="field"><label>Nama Supervisor</label><input id="fSupervisor" placeholder="Nama Supervisor"></div></div><div class="actions" style="justify-content:flex-end;margin-top:17px"><button type="button" onclick="closeModal()">Batal</button><button class="primary" type="submit">Simpan & Lihat Surat</button></div></form>`)}
function fillEmployee(){const e=employees.find(x=>x.nik===$('fNik').value);if(!e)return; $('fNo').value=e.nik;$('fPosition').value=e.position||'';$('fJoin').value=e.join||'';$('fDivision').value=e.division||'';$('fPhone').value=e.phone||''}
async function saveForm(ev){ev.preventDefault();const e=employees.find(x=>x.nik===$('fNik').value);if(!e)return alert('Pilih karyawan.');const rep=employees.find(x=>x.nik===$('fReplacement').value);const form={employee_nik:e.nik,application_date:$('fApplication').value,join:e.join||'',other_phone:$('fOther').value,leave_start:$('fStart').value,leave_end:$('fEnd').value,purpose:$('fPurpose').value,replacement_nik:rep?.nik||'',replacement_name:rep?.name||'',approved_date:$('fApproved').value,hrd_name:$('fHrd').value,manager_name:$('fManager').value,supervisor_name:$('fSupervisor').value};try{const x=await api('form-save','POST',{form});closeModal();await loadAll();render();preview(x.form.id)}catch(e){alert(e.message)}}
async function toggleSign(id,value){if(!confirm(value?'Tandai bahwa surat ini sudah ditandatangani secara offline?':'Batalkan status tanda tangan?'))return;try{await api('form-sign','POST',{id,is_signed:value});await loadAll();render()}catch(e){alert(e.message)}}
function preview(id){const f=forms.find(x=>x.id===id);if(!f)return;const d=f.data||{};const lines=[['Tanggal pengajuan Ijin',fmt(d.application_date)],['Nama',d.employee_name],['No. Absen',d.employee_nik],['Tgl masuk kerja (Tgl pertama kali masuk kerja)',fmt(d.join)],['Divisi',d.division],['No. telepon/hp',d.phone],['No. telepon lain yang dapat di hubungi',d.other_phone],['Tanggal Ijin yang diajukan',`${fmt(d.leave_start)} s/d ${fmt(d.leave_end)}`],['Keperluan',d.purpose],['Pengganti sementara',d.replacement_name],['Tanggal disetujui',fmt(d.approved_date)]];const html=`<div class="printform" id="printArea"><div style="display:flex;align-items:center;gap:15px"><img class="printlogo" src="/company-logo.jpeg"><div style="font-size:11px;color:#333">FORMULIR INTERNAL PERUSAHAAN</div></div><h2>Formulir Pengajuan Ijin tidak masuk kerja</h2><div class="printrows">${lines.map(([a,b])=>`<div>${esc(a)}</div><div>:</div><div>${esc(b||'')}</div>`).join('')}<div>(Di isi oleh HRD)</div><div></div><div></div></div><div class="signatures">${[['Di setujui','HRD',d.hrd_name],['Di ketahui','Manager',d.manager_name],['Di periksa','Supervisor',d.supervisor_name],['Pengganti','',d.replacement_name],['Karyawan','',d.employee_name]].map(([a,b,c])=>`<div><b>${a}</b><br>${b}<div class="sigspace">${esc(c||'')}</div></div>`).join('')}</div><p style="text-align:right;font-size:10px;margin-top:12px">${f.is_signed?'Status sistem: sudah ditandatangani offline':'Status sistem: menunggu tanda tangan offline'}</p></div><div class="actions no-print" style="justify-content:flex-end;margin-top:16px"><button onclick="window.print()">Cetak / Simpan PDF</button><button class="primary" onclick="downloadXlsx('${id}')">Download Excel (.xlsx)</button></div>`;openModal('Pratinjau Surat Izin',html)}
async function downloadXlsx(id){const r=await fetch('/api/portal?action=form-xlsx&id='+encodeURIComponent(id),{credentials:'same-origin'});if(!r.ok){let x={};try{x=await r.json()}catch{}return alert(x.error||'Gagal membuat Excel.')}const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Surat-Izin.xlsx';a.click();URL.revokeObjectURL(a.href)}
function employeeForm(nik=''){if(me.role!=='admin')return;const e=employees.find(x=>x.nik===nik)||{};openModal(nik?'Edit Karyawan':'Tambah Karyawan',`<form onsubmit="saveEmployee(event)"><div class="fieldgrid"><div class="field"><label>NIK *</label><input id="eNik" value="${esc(e.nik)}" ${nik?'readonly':''} required></div><div class="field"><label>Nama Lengkap *</label><input id="eName" value="${esc(e.name)}" required></div><div class="field"><label>Jabatan</label><input id="ePosition" value="${esc(e.position)}"></div><div class="field"><label>Divisi</label><input id="eDivision" value="${esc(e.division)}"></div><div class="field"><label>Tanggal Masuk</label><input id="eJoin" type="date" value="${esc(e.join)}"></div><div class="field"><label>No. HP</label><input id="ePhone" value="${esc(e.phone)}"></div><div class="field"><label>No. HP Darurat</label><input id="eEmergency" value="${esc(e.emergency)}"></div></div><div class="actions" style="justify-content:flex-end;margin-top:15px"><button type="button" onclick="closeModal()">Batal</button><button class="primary">Simpan</button></div></form>`)}
async function saveEmployee(ev){ev.preventDefault();const employee={nik:$('eNik').value,name:$('eName').value,position:$('ePosition').value,division:$('eDivision').value,join:$('eJoin').value,phone:$('ePhone').value,emergency:$('eEmergency').value};try{await api('employee-save','POST',{employee});closeModal();await loadAll();render()}catch(e){alert(e.message)}}
function executiveForm(id=''){const u=users.find(x=>x.id===id)||{};openModal(id?'Edit Akun Eksekutif':'Buat Akun Eksekutif',`<form onsubmit="saveExecutive(event,'${id}')"><div class="fieldgrid"><div class="field"><label>Nama Lengkap *</label><input id="uName" value="${esc(u.full_name)}" required></div><div class="field"><label>Username *</label><input id="uUsername" value="${esc(u.username)}" required></div><div class="field full"><label>${id?'Password baru (kosongkan jika tidak diubah)':'Password awal (minimal 12 karakter)'}</label><input id="uPassword" type="password" ${id?'':'required'}></div>${id?`<div class="field"><label>Status akun</label><select id="uActive"><option value="true" ${u.is_active?'selected':''}>Aktif</option><option value="false" ${!u.is_active?'selected':''}>Nonaktif</option></select></div>`:''}</div><div class="actions" style="justify-content:flex-end;margin-top:15px"><button type="button" onclick="closeModal()">Batal</button><button class="primary">Simpan Akun</button></div></form>`)}
async function saveExecutive(ev,id){ev.preventDefault();try{await api('executive-save','POST',{id,full_name:$('uName').value,username:$('uUsername').value,password:$('uPassword').value,is_active:$('uActive')?$('uActive').value==='true':true});closeModal();await loadAll();render()}catch(e){alert(e.message)}}
async function saveProfile(){try{await api('profile-save','POST',{full_name:$('profileName').value});me.full_name=$('profileName').value;$('topUser').textContent=me.full_name+' · '+(me.role==='admin'?'Admin':'Eksekutif');alert('Profil disimpan.')}catch(e){alert(e.message)}}
async function changePass(){try{await api('change-password','POST',{current_password:$('oldPass').value,new_password:$('newPass').value});alert('Password berhasil diubah.')}catch(e){alert(e.message)}}
async function exportReport(){try{const r=await fetch('/api/portal?action=report-xlsx',{credentials:'same-origin'});if(!r.ok){let x={};try{x=await r.json()}catch{}throw Error(x.error||'Gagal mengekspor laporan.')}const b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='Laporan-Form-Izin.xlsx';a.click();URL.revokeObjectURL(a.href)}catch(e){alert(e.message)}}
function fmt(v){if(!v)return '';const s=String(v).slice(0,10);const p=s.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:s}
async function init(){try{const x=await api('me');me=x.user;await start()}catch{$('loginView').classList.remove('hidden')}}
init();
</script></body></html>
